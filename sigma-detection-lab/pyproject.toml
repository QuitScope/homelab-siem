[project]
name = "sigma-detection-lab"
version = "0.1.0"
description = "Detection-as-Code for the HomeLab SIEM: Sigma rules -> Splunk SPL, tested against synthetic events"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Not a library: uv only installs the pinned tool chain into .venv (exact versions in uv.lock)
dependencies = [
    "sigma-cli==3.1.0",
    "pysigma==1.5.1",
    "pysigma-backend-splunk==2.1.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["splunk: needs a running Splunk instance (not part of the default test run)"]
