# Replaced by the Sigma correlation "Sigma - SSH Password Guessing From Single Source"
# (sigma-detection-lab/generated/savedsearches.conf); kept unscheduled for reference.
[HomeLab - Repeated Failed Logins]
description = (disabled, replaced by Sigma rule ssh_password_guessing) >= 3 failed logins from the same source within 5 minutes
# Note: fixed 5-min windows miss a burst split across two windows; use -10m + bin/streamstats if that matters
search = index=homelab_auth action=failure \
| stats count AS failures values(user) AS users by src, dest \
| where failures >= 3
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = */5 * * * *
enableSched = 0
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 4
alert.digest_mode = 1
action.logevent = 1
action.logevent.param.index = homelab_auth
action.logevent.param.sourcetype = homelab:alert
action.logevent.param.event = ALERT repeated failed logins src=$result.src$ dest=$result.dest$ failures=$result.failures$

[HomeLab - Data Quality]
# Login events only: sudo/useradd events have no src by design (sigma-detection-lab/docs/data-schema.md)
search = index=homelab_auth sourcetype=homelab:auth NOT event_type IN (sudo, user_created, group_created) \
| eval missing_fields=if(isnull(user),1,0)+if(isnull(src),1,0)+if(isnull(dest),1,0)+if(isnull(action),1,0) \
| stats count AS total_events sum(missing_fields) AS events_with_missing_fields
dispatch.earliest_time = -24h
dispatch.latest_time = now
