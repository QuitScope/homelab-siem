name: Validate Sigma detections

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: sigma-detection-lab

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
          working-directory: sigma-detection-lab

      - name: Install pinned toolchain (uv.lock)
        run: uv sync --locked

      - name: Validate Sigma rules (syntax, metadata, ATT&CK tags)
        run: ./scripts/validate-rules.sh

      - name: Convert to Splunk SPL and check generated/ is up to date
        run: |
          ./scripts/convert-rules.sh
          if [ -n "$(git status --porcelain -- generated)" ]; then
            git status --porcelain -- generated
            git diff -- generated
            echo "::error::generated/ is out of date - run scripts/convert-rules.sh and commit the result"
            exit 1
          fi

      - name: Run local tests (metadata, conversion, detection logic)
        run: uv run pytest
